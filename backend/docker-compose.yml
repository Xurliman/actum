name: actum-backend

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: actum
      POSTGRES_PASSWORD: actum
      POSTGRES_DB: actum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U actum -d actum"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
